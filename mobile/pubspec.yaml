name: falt
publish_to: none
description: Android-first workspace for Swedish tradespeople.
version: 0.2.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  uuid: ^4.5.1
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  # v11 requires win32/Dart 3.10 through its Windows implementation;
  # Flutter 3.35.7 ships Dart 3.9.2, so keep the v10 secure-storage line.
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.2
  supabase_flutter: ^2.18.3
  # Compatible with the Flutter 3.35/Dart 3.9 bootstrap target. 0.9.3
  # requires Flutter 3.38 through workmanager_apple.
  workmanager: 0.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

# Workmanager 0.9.2 declares ^0.9.3 for this interface, but 0.9.4 adds
# foregroundServiceConfig before workmanager_apple implements it.
dependency_overrides:
  workmanager_platform_interface: 0.9.3

flutter:
  uses-material-design: true
