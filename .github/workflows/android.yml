name: Android CI and evaluation APK
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate missing Flutter Android wrapper files
        run: |
          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar || ! -x android/gradlew ]]; then
            flutter create --platforms=android --org se.falt --project-name falt --no-pub .
          fi
      - name: Resolve Dart dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build demo APK
        run: flutter build apk --debug --dart-define=FALT_DEMO_MODE=true
      - uses: actions/upload-artifact@v4
        with:
          name: falt-android-demo-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
