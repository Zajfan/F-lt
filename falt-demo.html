ine{display:flex;justify-content:space-between;padding:8px 0;font-size:13px}.total-line:last-child{border-top:1px solid #dce2d6;font-size:19px;font-weight:650}.signature{width:100%;height:150px;touch-action:none;border:1px dashed #9eae92;border-radius:8px;background:#fafbf6}.notice{font-size:11px;color:#88907c;line-height:1.6;margin:15px 0}.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:1px;background:#e3e8dd;min-width:850px}.day{background:#fff;min-height:300px;padding:14px 10px}.day-title{font-size:12px;color:#829077;margin-bottom:18px}.day-title strong{display:block;font-size:23px;color:#294438;margin-top:7px}.calendar-job{background:#ecf1e3;border-left:3px solid #759252;border-radius:5px;padding:12px 9px;margin-bottom:10px;font-size:12px;cursor:pointer}.calendar-job strong{display:block;margin:7px 0}.calendar-job small{font-size:10px}.settings{max-width:700px}.person{display:flex;align-items:center;gap:10px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#193d34;color:white;padding:14px 24px;border-radius:9px;font-size:13px;display:none;z-index:10}.print-only{display:none}@media(max-width:1000px){aside{width:190px;padding:25px 15px}.workspace{margin-left:190px}main{padding:28px 24px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:16px}header,footer{padding-left:24px;padding-right:24px}}@media(max-width:650px){aside{position:sticky;top:0;width:100%;height:auto;padding:10px 14px;z-index:2;display:block}.logo{font-size:30px;letter-spacing:-2px}.company,.aside-bottom{display:none}nav{display:flex;overflow:auto;margin-top:9px;gap:3px}nav a{padding:8px;font-size:11px;gap:4px;white-space:nowrap}.workspace{margin-left:0}header{height:45px;font-size:11px;padding:0 18px}.demo span{display:none}main{padding:25px 16px}h1{font-size:28px}.heading{align-items:flex-start}.heading button{padding:11px}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:25px}.job{padding:20px 15px;gap:12px}footer{padding:18px;font-size:10px}footer span{display:none}.form-grid{grid-template-columns:1fr}.quote-row{grid-template-columns:1.5fr .5fr .7fr .8fr 25px;gap:4px}dialog{padding:24px 16px}.heading p{font-size:12px}.panel-head{padding:18px}.job-actions button{font-size:12px}}@media print{aside,header,footer,main,.close,.modal-actions,.signature,label,input,.notice{display:none!important}dialog{position:static;display:block;border:0;width:100%;max-height:none}dialog::backdrop{display:none}.print-only{display:block}}
</style></head><body><aside><a class="logo" href="#idag">fält<span>•</span></a><div class="company">Lindqvist El <small>Göteborg · Demoföretag</small></div><nav id="nav"></nav><div class="aside-bottom"><span class="avatar">EL</span><div>Erik Lindqvist<small>Administratör</small></div></div></aside><div class="workspace"><header><span id="crumb">Din arbetsdag</span><span class="demo">● DEMO <span> Sparas på den här enheten</span></span></header><main id="main"></main><footer>Fält. Mindre administration, mer hantverk.<span>Demo · Lokal lagring</span></footer></div><dialog id="dialog"><button class="close" aria-label="Stäng">×</button><div id="modal"></div></dialog><div id="toast" role="status"></div><script>const KEY='falt-demo-v1';
const today=()=>new Date().toLocaleDateString('sv-SE');
const initial=()=>({company:{name:'Lindqvist El',city:'Göteborg',email:'hej@lindqvistel.example',phone:'031-555 24 00',org:'559123-4567',address:'Verkstadsgatan 12, 417 07 Göteborg'},customers:[{id:'c1',name:'Anna Svensson',email:'anna@example.com',phone:'070-123 45 67',address:'Linnégatan 24, Göteborg'},{id:'c2',name:'Johan Berg',email:'johan@example.com',phone:'070-234 56 78',address:'Vasagatan 8, Göteborg'},{id:'c3',name:'BRF Eken',email:'styrelse@example.com',phone:'031-123 45 00',address:'Eklandagatan 15, Göteborg'}],prices:[{id:'p1',name:'Elektriker, arbete',price:650,unit:'tim',type:'Arbete'},{id:'p2',name:'LED-spotlight, dimbar',price:395,unit:'st',type:'Material'},{id:'p3',name:'Dimmer, infälld',price:595,unit:'st',type:'Material'},{id:'p4',name:'Vägguttag, jordat',price:185,unit:'st',type:'Material'},{id:'p5',name:'Servicebil',price:350,unit:'st',type:'Övrigt'}],quotes:[{id:'q1',number:2026001,title:'Spotlights kök',customer:'c1',status:'Skickad',deduction:'ROT',date:today(),rows:[{name:'Installation av spotlights',qty:6,price:650,type:'Arbete'},{name:'LED-spotlight, dimbar',qty:6,price:395,type:'Material'},{name:'Dimmer, infälld',qty:1,price:595,type:'Material'}]},{id:'q2',number:2026002,title:'Nya vägguttag vardagsrum',customer:'c2',status:'Utkast',deduction:'ROT',date:today(),rows:[{name:'Elektriker, arbete',qty:3,price:650,type:'Arbete'},{name:'Vägguttag, jordat',qty:4,price:185,type:'Material'}]}],jobs:[{id:'j1',title:'Byte av elcentral',customer:'c3',date:today(),time:'08:00',end:'11:30',person:'Erik',done:false},{id:'j2',title:'Felsökning & nya uttag',customer:'c2',date:today(),time:'13:00',end:'15:00',person:'Nora',done:false}],invoices:[],activity:[{text:'Offert skickad till Anna Svensson',time:'Idag, 07:45'},{text:'Nora tilldelades Felsökning & nya uttag',time:'Igår, 16:30'}]});
let db;try{db=JSON.parse(localStorage.getItem(KEY));if(!db||!db.quotes||!db.jobs)db=initial()}catch{db=initial()}
let page='idag',search='';const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK',maximumFractionDigits:0}).format(n),uid=()=>crypto.randomUUID(),customer=id=>db.customers.find(c=>c.id===id)||{name:'Borttagen kund',address:''};
function calc(q){const net=q.rows.reduce((s,r)=>s+r.qty*r.price,0),work=q.rows.filter(r=>r.type==='Arbete').reduce((s,r)=>s+r.qty*r.price,0)*1.25,discount=work*(q.deduction==='ROT'?.3:q.deduction==='RUT'?.5:0);return{net,vat:net*.25,discount,total:net*1.25-discount}}
function save(message){localStorage.setItem(KEY,JSON.stringify(db));if(message){db.activity.unshift({text:message,time:new Date().toLocaleString('sv-SE',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})});db.activity=db.activity.slice(0,12);localStorage.setItem(KEY,JSON.stringify(db));toast(message)}render()}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3000)}
const routes=[['idag','◷','Idag'],['offerter','▤','Offerter'],['schema','▦','Schema'],['fakturor','▧','Fakturor'],['kunder','♧','Kunder'],['prisbok','≡','Prisbok'],['foretag','⚙','Företag']];
function badge(s){return `<span class="badge ${esc(s)}">${esc(s)}</span>`}
function heading(k,t,s,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${s}</p></div>${action}</div>`}
function btn(text,action,cls=''){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function render(){document.title=`Fält · ${routes.find(r=>r[0]===page)?.[2]||'Idag'}`;$('#nav').innerHTML=routes.map(([id,icon,name])=>`<a href="#${id}" class="${page===id?'active':''}"><span>${icon}</span>${name}</a>`).join('');$('#crumb').textContent=page==='idag'?'Din arbetsdag':routes.find(r=>r[0]===page)?.[2];$('.company').innerHTML=`${esc(db.company.name)}<small>${esc(db.company.city)} · Demoföretag</small>`;$('#main').innerHTML=({idag:dashboard,offerter:quotes,schema:schedule,fakturor:invoices,kunder:customers,prisbok:prices,foretag:settings}[page]||dashboard)()}
function jobCard(j){return `<div class="job"><div class="job-time">${esc(j.time)}<small>${esc(j.end)}</small></div><div class="job-info"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${esc(j.title)}</h3>${badge(j.done?'Klar':'Planerad')}</div><p>${esc(customer(j.customer).name)} · ${esc(customer(j.customer).address)}</p><div class="job-actions"><span class="avatar" style="width:26px;height:26px;font-size:10px">${esc(j.person[0])}</span><span class="muted" style="font-size:12px;margin-right:auto">${esc(j.person)}</span>${btn(j.done?'Ångra klar':'✓ Markera klar',`done:${j.id}`)}</div></div></div>`}
function dashboard(){const jobs=db.jobs.filter(j=>j.date===today()),sent=db.quotes.filter(q=>q.status==='Skickad'),unpaid=db.invoices.filter(i=>i.status!=='Betald');return heading(new Date().toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'}),'God morgon, Erik.','Här är läget. Nu gör vi en bra arbetsdag.',btn('＋ Ny offert','newquote','primary'))+`<div class="stats">${[["Dagens jobb",`${jobs.filter(j=>j.done).length} / ${jobs.length}`,'jobb klara'],['Utestående offerter',sent.length,'väntar på kundens svar'],['Att fakturera',money(db.quotes.filter(q=>q.status==='Signerad'&&!db.invoices.some(i=>i.quote===q.id)).reduce((s,q)=>s+calc(q).total,0)),'godkända offerter'],['Obetalda fakturor',money(unpaid.reduce((s,i)=>s+calc(i).total,0)),`${unpaid.length} fakturor`]].map(([l,v,s])=>`<div class="stat"><span class="label">${l}</span><strong>${v}</strong><small>${s}</small></div>`).join('')}</div><div class="grid"><div><section class="panel"><div class="panel-head"><h2>Dagens jobb <span>(${jobs.length})</span></h2><a class="button" href="#schema">Visa schema ↗</a></div>${jobs.map(jobCard).join('')||'<div class="empty">Inga jobb idag. Boka något i schemat.</div>'}</section><section class="panel"><div class="panel-head"><h2>Offerter att följa upp</h2><a class="button" href="#offerter">Alla offerter ↗</a></div>${quoteTable(sent)}</section></div><div><div class="callout"><div class="eyebrow">Välkommen till Fält</div><h3>Från första offert till betalt.</h3><p>Prova hela flödet med Spotlights kök. Öppna kundens vy, signera och gör offerten till en faktura.</p>${btn('Öppna kundens vy ↗','customer:q1','primary')}</div><section class="panel"><div class="panel-head"><h2>Senaste händelser</h2><span>Aktivitet</span></div>${db.activity.slice(0,5).map(a=>`<div class="activity"><span class="dot"></span><div><p>${esc(a.text)}</p><small>${esc(a.time)}</small></div></div>`).join('')}</section><p class="notice">Din demodata sparas automatiskt i den här webbläsaren. Du kan börja om under Företag.</p></div></div>`}
function quoteTable(items){return `<div class="table-wrap"><table><thead><tr><th>Offert / kund</th><th>Status</th><th class="amount">Att betala</th><th></th></tr></thead><tbody>${items.map(q=>`<tr><td><strong>${esc(q.title)}</strong><small>#${q.number} · ${esc(customer(q.customer).name)}</small></td><td>${badge(q.status)}</td><td class="amount">${money(calc(q).total)}</td><td>${btn('Öppna →',`quote:${q.id}`)}</td></tr>`).join('')}</tbody></table>${!items.length?'<div class="empty">Inga offerter att visa.</div>':''}</div>`}
function quotes(){return heading('Från idé till uppdrag','Offerter','Skapa, skicka och följ upp. Allt på ett ställe.',btn('＋ Ny offert','newquote','primary'))+`<div class="toolbar"><input id="search" aria-label="Sök offerter" placeholder="Sök offert eller kund…" value="${esc(search)}"></div><section class="panel">${quoteTable(db.quotes.filter(q=>(q.title+' '+customer(q.customer).name).toLowerCase().includes(search.toLowerCase())))}</section>`}
function totals(q){const t=calc(q);return `<div class="totals"><div class="total-line"><span>Exklusive moms</span><span>${money(t.net)}</span></div><div class="total-line"><span>Moms 25 %</span><span>${money(t.vat)}</span></div>${t.discount?`<div class="total-line"><span>${q.deduction}-avdrag</span><span>−${money(t.discount)}</span></div>`:''}<div class="total-line"><span>Att betala</span><span>${money(t.total)}</span></div></div>`}
function documentBody(q){return `<div class="eyebrow">${esc(db.company.name)} · ${esc(db.company.city)}</div><h1>${esc(q.title)}</h1><p>Offert #${q.number} · ${esc(q.date)}<br>${esc(customer(q.customer).name)} · ${esc(customer(q.customer).address)}</p><div class="table-wrap"><table><thead><tr><th>Beskrivning</th><th>Antal</th><th class="amount">À-pris exkl. moms</th><th class="amount">Summa</th></tr></thead><tbody>${q.rows.map(r=>`<tr><td>${esc(r.name)}<small>${esc(r.type)}</small></td><td>${r.qty}</td><td class="amount">${money(r.price)}</td><td class="amount">${money(r.qty*r.price)}</td></tr>`).join('')}</tbody></table></div>${totals(q)}<p class="notice">ROT 30 % / RUT 50 % av arbetskostnaden inklusive moms. Förenklad demokalkyl för 2026, ingen kontroll hos Skatteverket. Offerten gäller i 30 dagar. Signeringen är en lokal demosignering.</p>`}
function show(html){$('#modal').innerHTML=html;$('#dialog').showModal()}function close(){$('#dialog').close()}
function quoteView(id,client=false){const q=db.quotes.find(q=>q.id===id);if(!q)return;const invoiced=db.invoices.find(i=>i.quote===id);show(`${client?'<div class="eyebrow">Kundens vy · Demo</div>':''}${documentBody(q)}${badge(q.status)}${q.signer?`<p>Godkänd av ${esc(q.signer)} · ${esc(q.signedAt)}</p>${q.signature?`<img alt="Kundens namnteckning" src="${q.signature}" style="max-width:280px">`:''}`:''}${client&&q.status==='Skickad'?`<label for="signer">Ditt namn</label><input id="signer" autocomplete="name" placeholder="För- och efternamn"><label>Signera med fingret eller musen (valfritt om du skriver ditt namn)</label><canvas id="signature" class="signature" width="640" height="180"></canvas>${btn('Rensa signatur','clear-sign')}<div class="modal-actions">${btn('Avböj offert',`decline:${id}`,'danger')}${btn('Godkänn offert',`sign:${id}`,'primary')}</div>`:!client?`<div class="modal-actions">${q.status==='Utkast'?btn('Redigera',`editquote:${id}`)+btn('Markera skickad',`send:${id}`,'primary'):''}${q.status==='Skickad'?btn('Kundens vy ↗',`customer:${id}`):''}${['Skickad','Signerad'].includes(q.status)&&!invoiced?btn('Gör till faktura →',`invoice:${id}`,'primary'):''}${invoiced?'<span class="badge">Faktura skapad</span>':''}${btn('Skriv ut / PDF','print')}</div>`:''}`);if($('#signature'))setupSignature()}
let signed=false;function setupSignature(){signed=false;const c=$('#signature'),ctx=c.getContext('2d');let drawing=false;const point=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};c.onpointermove=e=>{if(drawing){ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#244e3e';ctx.lineTo(...point(e));ctx.stroke();signed=true}};c.onpointerup=c.onpointercancel=()=>drawing=false}
let draft;function quoteEditor(id){draft=id?structuredClone(db.quotes.find(q=>q.id===id)):{id:uid(),number:Math.max(2026000,...db.quotes.map(q=>q.number))+1,title:'',customer:db.customers[0]?.id,status:'Utkast',date:today(),deduction:'ROT',rows:[]};show(`<h2>${id?'Redigera offert':'Ny offert'}</h2><form id="quoteform"><div class="form-grid"><div><label for="title">Uppdrag</label><input id="title" required value="${esc(draft.title)}" placeholder="Till exempel Spotlights kök"></div><div><label for="customer">Kund</label><select id="customer" required>${db.customers.map(c=>`<option value="${c.id}" ${draft.customer===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><label for="template">Utgå från en mall</label><select id="template"><option value="">Välj mall…</option><option value="spots">Spotlights kök</option><option value="service">Servicebesök</option><option value="outlets">Nya vägguttag</option></select><label>Offertens rader · priser exklusive moms</label><div id="rows"></div><div class="toolbar" style="margin-top:15px"><select id="article" style="max-width:250px"><option value="">Lägg till från prisbok…</option>${db.prices.map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.price)}</option>`).join('')}</select>${btn('＋ Egen rad','addrow')}</div><label for="deduction">Skattereduktion</label><select id="deduction">${['Ingen','ROT','RUT'].map(d=>`<option ${d===draft.deduction?'selected':''}>${d}</option>`).join('')}</select><div id="draft-total"></div><p class="notice">ROT 30 % / RUT 50 % på arbete inklusive moms. Förenklad demokalkyl för 2026.</p><div class="modal-actions">${btn('Avbryt','close')}<button class="primary" type="submit">Spara offert</button></div></form>`);drawRows();$('#quoteform').onsubmit=e=>{e.preventDefault();syncRows();draft.title=$('#title').value.trim();draft.customer=$('#customer').value;draft.deduction=$('#deduction').value;if(!draft.rows.length)return toast('Lägg till minst en rad.');if(!draft.title)return toast('Skriv uppdragets namn.');const pos=db.quotes.findIndex(q=>q.id===draft.id);pos<0?db.quotes.push(draft):db.quotes[pos]=draft;close();save('Offerten sparades')};$('#template').onchange=e=>{if(!e.target.value)return;syncRows();const type=e.target.value;draft.rows=type==='spots'?structuredClone(initial().quotes[0].rows):type==='outlets'?structuredClone(initial().quotes[1].rows):[{name:'Elektriker, arbete',qty:2,price:650,type:'Arbete'},{name:'Servicebil',qty:1,price:350,type:'Övrigt'}];$('#title').value=type==='spots'?'Spotlights kök':type==='outlets'?'Nya vägguttag':'Servicebesök';drawRows()};$('#article').onchange=e=>{const p=db.prices.find(p=>p.id===e.target.value);if(p){syncRows();draft.rows.push({name:p.name,price:p.price,type:p.type,qty:1});drawRows();e.target.value=''}};$('#deduction').onchange=()=>{draft.deduction=$('#deduction').value;syncRows();$('#draft-total').innerHTML=totals(draft)}}
function drawRows(){$('#rows').innerHTML=draft.rows.map((r,i)=>`<div class="quote-row"><input aria-label="Beskrivning rad ${i+1}" value="${esc(r.name)}" required><input aria-label="Antal rad ${i+1}" type="number" min="0.01" step="any" required value="${r.qty}"><input aria-label="Pris rad ${i+1}" type="number" min="0" step="any" required value="${r.price}"><select aria-label="Typ rad ${i+1}">${['Arbete','Material','Övrigt'].map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}</select>${btn('×',`remove-row:${i}`)}</div>`).join('');$('#draft-total').innerHTML=totals(draft);$('#rows').oninput=()=>{syncRows();$('#draft-total').innerHTML=totals(draft)}}
function syncRows(){draft.rows=[...document.querySelectorAll('.quote-row')].map(el=>{const f=el.querySelectorAll('input,select');return{name:f[0].value,qty:Number(f[1].value),price:Number(f[2].value),type:f[3].value}})}
function invoices(){return heading('Från utfört till betalt','Fakturor','Skapa en faktura från en skickad eller signerad offert.',`<a class="button primary" href="#offerter">Till offerter →</a>`)+`<section class="panel"><div class="table-wrap"><table><thead><tr><th>Faktura</th><th>Kund</th><th>Förfallodatum</th><th>Status</th><th class="amount">Att betala</th><th></th></tr></thead><tbody>${db.invoices.map(i=>`<tr><td><strong>#${i.invoiceNumber}</strong><small>${esc(i.title)}</small></td><td>${esc(customer(i.customer).name)}</td><td>${i.due}</td><td>${badge(i.status)}</td><td class="amount">${money(calc(i).total)}</td><td>${btn('Visa',`invoiceview:${i.id}`)} ${i.status!=='Betald'?btn('Markera betald',`paid:${i.id}`,'primary'):''}</td></tr>`).join('')}</tbody></table>${!db.invoices.length?'<div class="empty">Din första faktura börjar med en offert.<br>Öppna Spotlights kök under Offerter och välj Gör till faktura.</div>':''}</div></section>`}
let weekOffset=0;function weekDays(){let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+weekOffset*7);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(x.getDate()+i);return x})}
function schedule(){return heading('Rätt person, rätt plats','Schema','Planera veckan och ge varje jobb en ansvarig.',btn('＋ Boka jobb','newjob','primary'))+`<div class="toolbar">${btn('←','prevweek')}${btn('Denna vecka','thisweek')}${btn('→','nextweek')}<span class="muted">${weekDays()[0].toLocaleDateString('sv-SE',{day:'numeric',month:'long'})} – ${weekDays()[6].toLocaleDateString('sv-SE',{day:'numeric',month:'long'})}</span></div><section class="panel table-wrap"><div class="week">${weekDays().map(d=>`<div class="day"><div class="day-title">${d.toLocaleDateString('sv-SE',{weekday:'short'})}<strong>${d.getDate()} ${d.toLocaleDateString('sv-SE')===today()?'<span class="badge">Idag</span>':''}</strong></div>${db.jobs.filter(j=>j.date===d.toLocaleDateString('sv-SE')).sort((a,b)=>a.time.localeCompare(b.time)).map(j=>`<div class="calendar-job" role="button" tabindex="0" data-action="job:${j.id}">${esc(j.time)}–${esc(j.end)}<strong>${esc(j.title)}</strong>${esc(customer(j.customer).name)}<small>${esc(j.person)} · ${j.done?'Klar':'Planerad'}</small></div>`).join('')}</div>`).join('')}</div></section>`}
function jobEditor(id){const j=db.jobs.find(j=>j.id===id)||{id:uid(),title:'',customer:db.customers[0]?.id,date:today(),time:'08:00',end:'10:00',person:'Erik',done:false};show(`<h2>${id?'Ändra bokning':'Boka jobb'}</h2><form id="jobform"><label for="jobtitle">Uppdrag</label><input id="jobtitle" required value="${esc(j.title)}"><label for="jobcustomer">Kund</label><select id="jobcustomer">${db.customers.map(c=>`<option value="${c.id}" ${j.customer===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div class="form-grid"><div><label for="jobdate">Datum</label><input id="jobdate" type="date" required value="${j.date}"></div><div><label for="person">Ansvarig</label><select id="person"><option ${j.person==='Erik'?'selected':''}>Erik</option><option ${j.person==='Nora'?'selected':''}>Nora</option></select></div><div><label for="start">Start</label><input id="start" type="time" required value="${j.time}"></div><div><label for="end">Slut</label><input id="end" type="time" required value="${j.end}"></div></div><div class="modal-actions">${id?btn('Ta bort bokning',`deletejob:${id}`,'danger'):''}<button class="primary">Spara bokning</button></div></form>`);$('#jobform').onsubmit=e=>{e.preventDefault();if($('#end').value<=$('#start').value)return toast('Sluttiden måste vara efter starttiden.');const updated={...j,title:$('#jobtitle').value.trim(),customer:$('#jobcustomer').value,date:$('#jobdate').value,time:$('#start').value,end:$('#end').value,person:$('#person').value};const conflict=db.jobs.find(x=>x.id!==j.id&&x.date===updated.date&&x.person===updated.person&&x.time<updated.end&&x.end>updated.time);if(conflict)return toast(`${updated.person} har redan ett jobb vid den tiden.`);if(!updated.title)return toast('Skriv uppdragets namn.');const idx=db.jobs.findIndex(x=>x.id===j.id);idx<0?db.jobs.push(updated):db.jobs[idx]=updated;close();save('Bokningen sparades')}}
function customers(){return heading('Människorna bakom uppdragen','Kunder','Kontaktuppgifter och historik, nära till hands.',btn('＋ Ny kund','newcustomer','primary'))+`<section class="panel table-wrap"><table><thead><tr><th>Kund</th><th>Kontakt</th><th>Adress</th><th>Uppdrag</th><th></th></tr></thead><tbody>${db.customers.map(c=>`<tr><td><div class="person"><span class="avatar">${esc(c.name.split(' ').map(n=>n[0]).slice(0,2).join(''))}</span><strong>${esc(c.name)}</strong></div></td><td>${esc(c.email)}<small>${esc(c.phone)}</small></td><td>${esc(c.address)}</td><td>${db.quotes.filter(q=>q.customer===c.id).length} offerter</td><td>${btn('Visa kund →',`customeredit:${c.id}`)}</td></tr>`).join('')}</tbody></table></section>`}
function customerEditor(id){const c=db.customers.find(c=>c.id===id)||{id:uid(),name:'',email:'',phone:'',address:''};show(`<h2>${id?'Kunduppgifter':'Ny kund'}</h2><form id="customerform">${[['name','Namn'],['email','E-post'],['phone','Telefon'],['address','Adress']].map(([k,l])=>`<label for="c-${k}">${l}</label><input id="c-${k}" ${k==='name'?'required':''} type="${k==='email'?'email':'text'}" value="${esc(c[k])}">`).join('')}<div class="modal-actions"><button class="primary">Spara kund</button></div></form>${id?`<h3>Historik</h3>${quoteTable(db.quotes.filter(q=>q.customer===id))}<p class="muted">${db.jobs.filter(j=>j.customer===id).map(j=>`${esc(j.date)} · ${esc(j.title)} · ${j.done?'Klar':'Planerad'}`).join('<br>')||'Inga bokade jobb ännu.'}</p>`:''}`);$('#customerform').onsubmit=e=>{e.preventDefault();const next={...c};for(const k of ['name','email','phone','address'])next[k]=$(`#c-${k}`).value.trim();if(!next.name)return;const idx=db.customers.findIndex(x=>x.id===c.id);idx<0?db.customers.push(next):db.customers[idx]=next;close();save('Kunduppgifterna sparades')}}
function prices(){return heading('Dina priser, redo i fickan','Prisbok','Egna artiklar och arbete. Alla priser anges exklusive moms.',btn('＋ Ny artikel','newprice','primary'))+`<section class="panel table-wrap"><table><thead><tr><th>Artikel</th><th>Typ</th><th>Enhet</th><th class="amount">Pris exkl. moms</th><th></th></tr></thead><tbody>${db.prices.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${badge(p.type)}</td><td>${esc(p.unit)}</td><td class="amount">${money(p.price)}</td><td>${btn('Redigera',`price:${p.id}`)}</td></tr>`).join('')}</tbody></table></section>`}
function priceEditor(id){const p=db.prices.find(p=>p.id===id)||{id:uid(),name:'',price:0,unit:'st',type:'Material'};show(`<h2>${id?'Redigera artikel':'Ny artikel'}</h2><form id="priceform"><label for="p-name">Namn</label><input id="p-name" required value="${esc(p.name)}"><div class="form-grid"><div><label for="p-price">Pris exkl. moms</label><input id="p-price" required type="number" min="0" step="0.01" value="${p.price}"></div><div><label for="p-unit">Enhet</label><input id="p-unit" required value="${esc(p.unit)}"></div></div><label for="p-type">Typ</label><select id="p-type">${['Arbete','Material','Övrigt'].map(t=>`<option ${t===p.type?'selected':''}>${t}</option>`).join('')}</select><div class="modal-actions">${id?btn('Ta bort',`deleteprice:${id}`,'danger'):''}<button class="primary">Spara artikel</button></div></form>`);$('#priceform').onsubmit=e=>{e.preventDefault();const next={id:p.id,name:$('#p-name').value.trim(),price:Number($('#p-price').value),unit:$('#p-unit').value.trim(),type:$('#p-type').value};if(!next.name||!next.unit)return;const idx=db.prices.findIndex(x=>x.id===p.id);idx<0?db.prices.push(next):db.prices[idx]=next;close();save('Prisboken uppdaterades')}}
function settings(){return heading('Din verksamhet','Företag','Uppgifter som följer med dina offerter och fakturor.')+`<section class="panel settings" style="padding:25px"><form id="companyform"><h2>Företagsuppgifter</h2><div class="form-grid">${[['name','Företagsnamn'],['org','Organisationsnummer'],['email','E-post'],['phone','Telefon'],['address','Adress'],['city','Ort']].map(([k,l])=>`<div><label for="co-${k}">${l}</label><input id="co-${k}" required ${k==='email'?'type="email"':''} value="${esc(db.company[k])}"></div>`).join('')}</div><div class="modal-actions"><button class="primary">Spara ändringar</button></div></form></section><section class="panel settings" style="padding:25px"><h2>Om demon</h2><p>All data lagras i din webbläsare. Inga riktiga mejl, betalningar eller myndighetskontroller görs. Kundvyn och namnteckningen är en demonstration, utan identifiering eller juridisk signeringstjänst.</p><p>Demokalkylen använder 25 % moms och förenklat ROT 30 % / RUT 50 % på arbete inklusive moms för 2026.</p><div class="toolbar">${btn('Exportera demodata','export')}${btn('Återställ demon','reset','danger')}</div></section>`}
document.addEventListener('submit',e=>{if(e.target.id==='companyform'){e.preventDefault();for(const k of Object.keys(db.company))db.company[k]=$(`#co-${k}`).value.trim();save('Företagsuppgifterna sparades')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.tagName==='BUTTON')e.preventDefault();act(el.dataset.action)});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.calendar-job'))act(e.target.dataset.action)});
function act(action){const [a,id]=action.split(':');const q=db.quotes.find(q=>q.id===id);switch(a){case'close':close();break;case'newquote':quoteEditor();break;case'editquote':close();quoteEditor(id);break;case'quote':quoteView(id);break;case'customer':if($('#dialog').open)close();quoteView(id,true);break;case'done':{const j=db.jobs.find(j=>j.id===id);j.done=!j.done;save(j.done?`${j.title} markerades klar`:`${j.title} öppnades igen`);break}case'send':q.status='Skickad';close();save('Offerten markerades skickad (demo)');quoteView(id);break;case'sign':{const name=$('#signer').value.trim();if(!name)return toast('Skriv ditt namn för att godkänna.');q.status='Signerad';q.signer=name;q.signedAt=new Date().toLocaleString('sv-SE');q.signature=signed?$('#signature').toDataURL():null;close();save('Offerten godkändes av '+name);quoteView(id,true);break}case'clear-sign':$('#signature').getContext('2d').clearRect(0,0,640,180);signed=false;break;case'decline':q.status='Avböjd';close();save('Offerten avböjdes');quoteView(id,true);break;case'invoice':{if(db.invoices.some(i=>i.quote===id))return toast('Offerten är redan fakturerad.');if(!['Skickad','Signerad'].includes(q.status))return;const due=new Date();due.setDate(due.getDate()+30);db.invoices.push({...structuredClone(q),id:uid(),quote:id,invoiceNumber:Math.max(1000,...db.invoices.map(i=>i.invoiceNumber))+1,status:'Obetald',due:due.toLocaleDateString('sv-SE'),date:today()});close();save('Fakturan skapades');location.hash='fakturor';break}case'paid':{const i=db.invoices.find(i=>i.id===id);i.status='Betald';i.paidAt=today();save('Fakturan markerades betald');break}case'invoiceview':{const i=db.invoices.find(i=>i.id===id);show(`<div class="eyebrow">Faktura #${i.invoiceNumber} · ${esc(i.status)}</div>${documentBody(i).replace('Offert #'+i.number,'Faktura #'+i.invoiceNumber)}<p>Förfallodatum: ${i.due}${i.paidAt?'<br>Betald: '+i.paidAt:''}</p><div class="modal-actions">${btn('Skriv ut / PDF','print')}</div>`);break}case'print':window.print();break;case'addrow':syncRows();draft.rows.push({name:'',qty:1,price:0,type:'Arbete'});drawRows();break;case'remove-row':syncRows();draft.rows.splice(Number(id),1);drawRows();break;case'newjob':jobEditor();break;case'job':jobEditor(id);break;case'deletejob':db.jobs=db.jobs.filter(j=>j.id!==id);close();save('Bokningen togs bort');break;case'prevweek':weekOffset--;render();break;case'nextweek':weekOffset++;render();break;case'thisweek':weekOffset=0;render();break;case'newcustomer':customerEditor();break;case'customeredit':customerEditor(id);break;case'newprice':priceEditor();break;case'price':priceEditor(id);break;case'deleteprice':db.prices=db.prices.filter(p=>p.id!==id);close();save('Artikeln togs bort');break;case'export':{const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='falt-demodata.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'reset':show(`<h2>Börja om med demon?</h2><p>Alla ändringar på den här enheten ersätts med Lindqvist Els exempeldata.</p><div class="modal-actions">${btn('Behåll mina ändringar','close')}${btn('Återställ nu','confirmreset','danger')}</div>`);break;case'confirmreset':db=initial();close();save();toast('Demon har återställts');break}}
$('.close').onclick=close;$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'idag';if(!routes.some(r=>r[0]===page))page='idag';search='';render()});page=location.hash.slice(1)||'idag';if(!routes.some(r=>r[0]===page))page='idag';render();
</script></body></html>
